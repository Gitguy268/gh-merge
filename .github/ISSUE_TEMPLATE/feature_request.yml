name: Feature request
description: An idea for gh merge.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should gh merge do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: When would you use it?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead
